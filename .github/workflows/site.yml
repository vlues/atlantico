# Builds the ESP32 firmware and publishes the static site (with firmware) to GitHub Pages.
name: Site + firmware
on:
  push:
    branches: [main]
    paths: ['web/**', 'firmware/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio==6.2.0 esptool==5.5.0
      - run: pio run -d firmware
      - run: bash firmware/merge.sh firmware/out
      - uses: actions/upload-artifact@v4
        with: { name: firmware, path: firmware/out/*.bin }

  pages:
    needs: firmware
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: firmware, path: web/firmware }
      - name: Point the site at the Worker
        env:
          API: ${{ vars.ATLANTICO_API }}
        run: |
          printf "window.ATLANTICO = { api: '%s', simulate: false };\n" "$API" > web/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deploy
        uses: actions/deploy-pages@v4
