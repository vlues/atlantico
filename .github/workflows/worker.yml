# Redeploys the Worker when its code changes. Secrets stay in Cloudflare; nothing secret is here.
name: Worker
on:
  push:
    branches: [main]
    paths: ['worker/**', 'web/lib/**', 'wrangler.toml', 'package-lock.json', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply atlantico --remote
          npx wrangler deploy
