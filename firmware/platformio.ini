; Atlántico firmware. Built by GitHub Actions and flashed from the Add-device page.
; Local build (optional): pip install platformio && pio run -d firmware
; Everything is pinned so a rebuild in five years gives the same result.

[platformio]
default_envs = panel-xiao75, panel-spectra6, plant-c3

[env]
; pioarduino = Arduino-ESP32 core 3.3.12 (ESP-IDF 5.5)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
  -DFW_VERSION=\"1.0.0\"
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  bblanchon/ArduinoJson @ 7.2.2

; ── Wall panels ─────────────────────────────────────────────────────────────
; Pins follow the XIAO D-pin names so the same wiring works on C3 and S3.
; Seeed XIAO 7.5" ePaper Panel (ESP32-C3, 800x480 black/white, UC8179).
; Check the pins against Seeed's driver-board schematic before the first flash.
[env:panel-xiao75]
board = seeed_xiao_esp32c3
build_src_filter = +<panel/>
build_flags = ${env.build_flags}
  -DFW_NAME=\"atlantico-panel\"
  -DPANEL_BW_750_T7
  -DEPD_CS=D1 -DEPD_DC=D3 -DEPD_RST=D0 -DEPD_BUSY=D2
  -DBATTERY_PIN=-1
lib_deps = ${env.lib_deps}
  zinggjm/GxEPD2 @ 1.6.9

; 7.3" Spectra 6 (E6) colour panel on a XIAO ESP32-S3 Plus + XIAO ePaper driver board.
[env:panel-spectra6]
board = seeed_xiao_esp32s3
board_build.arduino.memory_type = qio_opi
build_src_filter = +<panel/>
build_flags = ${env.build_flags}
  -DFW_NAME=\"atlantico-panel-6c\"
  -DPANEL_6C_730_E6
  -DBOARD_HAS_PSRAM
  -DEPD_CS=D1 -DEPD_DC=D3 -DEPD_RST=D0 -DEPD_BUSY=D2
  -DBATTERY_PIN=-1
lib_deps = ${env.lib_deps}
  zinggjm/GxEPD2 @ 1.6.9

; ── Plant node ──────────────────────────────────────────────────────────────
[env:plant-c3]
board = seeed_xiao_esp32c3
build_src_filter = +<plant/>
build_flags = ${env.build_flags}
  -DFW_NAME=\"atlantico-plant\"
lib_deps = ${env.lib_deps}
  pololu/VL53L0X @ 1.3.1
  paulstoffregen/OneWire @ 2.3.8
  milesburton/DallasTemperature @ 4.0.6
