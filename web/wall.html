<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>Atlántico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="manifest" href="wall.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wall">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    html, body { height: 100%; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; transition: transform 4s ease; }
    /* A new screen offers itself to the owner, quietly, in a corner. */
    .screen-code { position: fixed; right: 24px; bottom: 24px; display: flex; gap: 16px; align-items: center; max-width: 420px;
      padding: 16px 18px; background: rgba(10,10,11,.88); color: #e9e6df; border: 1px solid rgba(233,230,223,.18);
      font: 300 13px/1.5 Inter, system-ui, sans-serif; animation: fade 1.6s ease both; z-index: 2; }
    .screen-code .qr { width: 92px; height: 92px; background: #f2f0eb; padding: 6px; flex: none; }
    .screen-code .qr:empty { display: none; }
    .screen-code .qr svg { width: 100%; height: 100%; display: block; }
    .screen-code p { margin: 0; }
    .screen-code .t { font: italic 300 20px 'Cormorant Garamond', Georgia, serif; }
    .screen-code .t span { display: block; font: 300 11px Inter, system-ui, sans-serif; color: #8d8a83; }
    .screen-code .c { font: 300 34px 'Cormorant Garamond', Georgia, serif; letter-spacing: .2em; margin: 4px 0; }
    .screen-code .c.small { font-size: 22px; letter-spacing: .04em; }
    .screen-code .h { color: #8d8a83; font-size: 11px; }
    .screen-code button { align-self: flex-start; background: none; border: 0; color: #8d8a83; font-size: 20px; cursor: pointer; padding: 0 0 0 4px; }
  </style>
</head>
<body>
  <canvas aria-label="Atlántico: the sea outside, drawn as lines"></canvas>
  <script src="config.js"></script>
  <script src="vendor/qrcode-generator-1.4.4.js"></script>
  <script type="module" src="js/wall.js"></script>
</body>
</html>
